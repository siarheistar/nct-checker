name: NCT Slot Monitor

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-slots:
    runs-on: ubuntu-latest

    env:
      REGISTRATION: ${{ vars.NCT_REGISTRATION || '05D77568' }}
      BOOKING_ID: ${{ vars.NCT_BOOKING_ID || '' }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Check NCT availability and send alerts
        run: |
          python << 'PYTHON_SCRIPT'
          import asyncio
          import os
          import re
          import smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime
          from playwright.async_api import async_playwright

          REGISTRATION = os.environ.get('REGISTRATION', '05D77568')
          BOOKING_ID = os.environ.get('BOOKING_ID', '')
          ALERT_EMAIL = os.environ.get('ALERT_EMAIL', '')
          SMTP_USER = os.environ.get('SMTP_USER', '')
          SMTP_PASS = os.environ.get('SMTP_PASS', '')

          # Thresholds for alerts (in days)
          URGENT_THRESHOLD = 7
          SOON_THRESHOLD = 30

          def parse_date(date_str):
              """Parse date formats like '28th May 2026'"""
              date_str = date_str.strip()
              date_str = re.sub(r'(\d+)(st|nd|rd|th)', r'\1', date_str)
              formats = ["%d %B %Y", "%d %b %Y", "%d/%m/%Y"]
              for fmt in formats:
                  try:
                      return datetime.strptime(date_str, fmt)
                  except ValueError:
                      continue
              return None

          def send_alert_email(subject, html_content):
              """Send email alert"""
              if not SMTP_USER or not SMTP_PASS or not ALERT_EMAIL:
                  print("Email not configured - skipping")
                  return False

              try:
                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = subject
                  msg['From'] = SMTP_USER
                  msg['To'] = ALERT_EMAIL
                  msg.attach(MIMEText(html_content, 'html'))

                  with smtplib.SMTP('smtp.gmail.com', 587) as server:
                      server.starttls()
                      server.login(SMTP_USER, SMTP_PASS)
                      server.sendmail(SMTP_USER, ALERT_EMAIL, msg.as_string())

                  print(f"Alert email sent to {ALERT_EMAIL}")
                  return True
              except Exception as e:
                  print(f"Failed to send email: {e}")
                  return False

          async def check_nct_availability():
              """Check NCT availability - supports both new booking and reschedule flows"""
              slots = []
              vehicle_info = {}
              booking_info = {}
              is_reschedule = bool(BOOKING_ID)

              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      viewport={'width': 1920, 'height': 1080},
                      user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  )
                  page = await context.new_page()

                  try:
                      print(f"Checking NCT availability for {REGISTRATION}...")
                      if is_reschedule:
                          print(f"Using RESCHEDULE flow with Booking ID: {BOOKING_ID}")

                      # Go to homepage
                      await page.goto("https://www.ncts.ie", wait_until='networkidle', timeout=30000)
                      await page.wait_for_timeout(1000)

                      # Handle cookie consent
                      try:
                          accept_btn = page.locator('#bs-gdpr-cookies-modal-accept-btn')
                          if await accept_btn.is_visible(timeout=3000):
                              await accept_btn.click()
                              await page.wait_for_timeout(1000)
                      except Exception:
                          pass

                      # Enter registration
                      await page.locator('#rid').fill(REGISTRATION)
                      await page.wait_for_timeout(500)
                      await page.locator('#btnSearchVehicle').click()

                      # Wait for vehicle confirmation page
                      await page.wait_for_url('**rid=**', timeout=15000)
                      await page.wait_for_timeout(2000)

                      # Extract vehicle info
                      page_text = await page.inner_text('body')
                      patterns = {
                          'make': r'Make[:\s]+([A-Z]+)',
                          'model': r'Model[:\s]+([A-Z0-9\s]+?)(?=\s*Year|\s*$)',
                          'year': r'Year[:\s]+(\d{4})',
                          'nct_due_date': r'(?:Next )?NCT Due Date[:\s]+(\d{2}/\d{2}/\d{4})',
                      }
                      for field, pattern in patterns.items():
                          match = re.search(pattern, page_text, re.I)
                          if match:
                              vehicle_info[field] = match.group(1).strip()

                      # Check checkboxes and confirm
                      checkboxes = page.locator('input[type="checkbox"]')
                      for i in range(await checkboxes.count()):
                          cb = checkboxes.nth(i)
                          if not await cb.is_checked():
                              await cb.check()
                              await page.wait_for_timeout(200)

                      await page.locator('#confirmVehicleYes').click()
                      await page.wait_for_timeout(3000)

                      # Check if reschedule flow is needed
                      if is_reschedule:
                          # Look for RESCHEDULE BOOKING button
                          reschedule_btn = page.locator('text=RESCHEDULE BOOKING').first
                          if await reschedule_btn.is_visible(timeout=3000):
                              print("Existing booking detected - using reschedule flow")
                              await reschedule_btn.click()
                              await page.wait_for_timeout(2000)

                              # Enter Booking ID
                              print(f"Entering booking ID: {BOOKING_ID}")
                              booking_input = page.locator('input[type="text"]').first
                              await booking_input.wait_for(state='visible', timeout=10000)
                              await booking_input.fill(BOOKING_ID)
                              await page.wait_for_timeout(500)

                              # Click Reschedule Booking button to submit
                              confirm_btn = page.locator('text=RESCHEDULE BOOKING').last
                              await confirm_btn.click()
                              await page.wait_for_timeout(3000)

                              # Extract current booking info
                              page_text = await page.inner_text('body')
                              booking_patterns = {
                                  'centre': r'NCT Centre[:\s]+([^\n]+)',
                                  'date': r'Date[:\s]+([^\n]+)',
                                  'time': r'Time[:\s]+(\d{1,2}:\d{2})',
                              }
                              for field, pattern in booking_patterns.items():
                                  match = re.search(pattern, page_text, re.I)
                                  if match:
                                      booking_info[field] = match.group(1).strip()
                              booking_info['booking_id'] = BOOKING_ID

                              print(f"Current booking: {booking_info}")

                              # Click YES to confirm booking
                              yes_btn = page.locator('text=YES').last
                              if await yes_btn.is_visible(timeout=5000):
                                  await yes_btn.click()
                                  await page.wait_for_timeout(3000)
                          else:
                              print("No existing booking found - falling back to regular flow")

                      # Click "SEE MORE SUGGESTED CENTRES"
                      try:
                          see_more = page.locator('text=SEE MORE SUGGESTED CENTRES')
                          if await see_more.is_visible(timeout=3000):
                              await see_more.click()
                              await page.wait_for_timeout(2000)
                      except Exception:
                          pass

                      # Extract availability
                      await page.wait_for_selector('text=Other Suggested Centre', timeout=10000)
                      page_text = await page.inner_text('body')

                      # Extract selected centre
                      centre_match = re.search(r'SELECTED CENTRE\s*\n\s*([^\n]+)', page_text)
                      selected_centre = centre_match.group(1).strip() if centre_match else ""

                      # Extract date for selected centre
                      date_match = re.search(r'NEXT AVAILABLE DATE\s*\n?\s*(\d+(?:st|nd|rd|th)?\s+\w+\s+\d{4})', page_text)
                      if date_match and selected_centre:
                          parsed_date = parse_date(date_match.group(1))
                          if parsed_date:
                              days_away = (parsed_date - datetime.now()).days
                              slots.append({
                                  'centre': selected_centre,
                                  'date': parsed_date,
                                  'date_formatted': parsed_date.strftime('%a %d %b %Y'),
                                  'days_away': days_away
                              })

                      # Extract other centres
                      lines = page_text.split('\n')
                      for line in lines:
                          line = line.strip()
                          match = re.match(r'^([A-Za-z\s\d\(\),]+?)\t+(\d+(?:st|nd|rd|th)?\s+\w+\s+\d{4})', line)
                          if match:
                              centre = match.group(1).strip()
                              date_str = match.group(2)
                              if 'Other Suggested' in centre or 'Next Available' in centre:
                                  continue
                              parsed_date = parse_date(date_str)
                              if parsed_date and centre:
                                  days_away = (parsed_date - datetime.now()).days
                                  slots.append({
                                      'centre': centre,
                                      'date': parsed_date,
                                      'date_formatted': parsed_date.strftime('%a %d %b %Y'),
                                      'days_away': days_away
                                  })

                  except Exception as e:
                      print(f"Error: {e}")
                  finally:
                      await browser.close()

              # Sort by date
              slots.sort(key=lambda x: x['date'])
              return vehicle_info, booking_info, slots

          def generate_status_email(vehicle_info, booking_info, slots, alert_type):
              """Generate HTML email for all status types including info"""
              is_reschedule = bool(booking_info)

              if alert_type == "urgent":
                  header_color = "#dc3545"
                  title = "🚨 URGENT: Earlier NCT Slot Available!" if is_reschedule else "🚨 URGENT: NCT Slot Available!"
                  subtitle = "Book immediately - slot may be taken!"
              elif alert_type == "soon":
                  header_color = "#fd7e14"
                  title = "📅 Earlier NCT Slot Available!" if is_reschedule else "📅 NCT Slot Available Soon!"
                  subtitle = "Good availability within 30 days"
              else:  # info
                  header_color = "#28a745"
                  title = "✅ NCT Reschedule Status" if is_reschedule else "✅ NCT Slot Status Update"
                  subtitle = "Regular monitoring report"

              vehicle_desc = f"{vehicle_info.get('year', '')} {vehicle_info.get('make', '')} {vehicle_info.get('model', '')}".strip()
              earliest = slots[0] if slots else None

              # Current booking section (for reschedule)
              booking_html = ""
              if is_reschedule:
                  booking_html = f"""
                  <div style="background: #fff3cd; border: 1px solid #ffc107; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                      <strong style="color: #856404;">📋 Current Booking:</strong><br>
                      <span style="color: #856404;">
                          Centre: {booking_info.get('centre', 'N/A')}<br>
                          Date: {booking_info.get('date', 'N/A')}<br>
                          Time: {booking_info.get('time', 'N/A')}<br>
                          Booking ID: {booking_info.get('booking_id', 'N/A')}
                      </span>
                  </div>
                  """

              slots_html = ""
              for slot in slots[:5]:
                  days = slot['days_away']
                  if days <= 7:
                      badge = '<span style="background:#dc3545;color:white;padding:2px 8px;border-radius:4px;font-size:12px;">URGENT</span>'
                  elif days <= 30:
                      badge = '<span style="background:#fd7e14;color:white;padding:2px 8px;border-radius:4px;font-size:12px;">SOON</span>'
                  else:
                      badge = ''
                  slots_html += f"""
                  <tr>
                      <td style="padding: 12px; border-bottom: 1px solid #eee;">{slot['centre']}</td>
                      <td style="padding: 12px; border-bottom: 1px solid #eee;">{slot['date_formatted']}</td>
                      <td style="padding: 12px; border-bottom: 1px solid #eee;">{days} days {badge}</td>
                  </tr>
                  """

              # Status summary
              urgent_count = len([s for s in slots if s['days_away'] <= 7])
              soon_count = len([s for s in slots if s['days_away'] <= 30])

              if urgent_count > 0:
                  status_text = f"🚨 URGENT: {urgent_count} slot(s) within 7 days!"
                  status_color = "#dc3545"
              elif soon_count > 0:
                  status_text = f"📅 {soon_count} slot(s) within 30 days"
                  status_color = "#fd7e14"
              elif earliest:
                  status_text = f"✓ No urgent slots - earliest is {earliest['days_away']} days away"
                  status_color = "#28a745"
              else:
                  status_text = "❌ No slots found"
                  status_color = "#6c757d"

              html = f"""
              <html>
              <body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f8f9fa;">
                  <div style="background: {header_color}; color: white; padding: 25px; border-radius: 12px 12px 0 0;">
                      <h1 style="margin: 0; font-size: 24px;">{title}</h1>
                      <p style="margin: 8px 0 0 0; opacity: 0.9;">{subtitle}</p>
                  </div>

                  <div style="padding: 25px; background: white; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                      <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                          <strong>🚗 Vehicle:</strong> {REGISTRATION} {('- ' + vehicle_desc) if vehicle_desc else ''}<br>
                          <strong>📋 NCT Due:</strong> {vehicle_info.get('nct_due_date', 'Unknown')}
                      </div>

                      {booking_html}

                      <div style="background: {status_color}15; border-left: 4px solid {status_color}; padding: 15px; margin-bottom: 20px;">
                          <strong style="color: {status_color};">{'Earliest for Reschedule' if is_reschedule else 'Earliest'}:</strong> {earliest['centre']} - {earliest['date_formatted']} ({earliest['days_away']} days)<br>
                          <span style="color: {status_color};">{status_text}</span>
                      </div>

                      <table style="width: 100%; border-collapse: collapse; background: #fafafa; border-radius: 8px; overflow: hidden;">
                          <thead>
                              <tr style="background: #343a40; color: white;">
                                  <th style="padding: 12px; text-align: left;">Centre</th>
                                  <th style="padding: 12px; text-align: left;">Date</th>
                                  <th style="padding: 12px; text-align: left;">Days Away</th>
                              </tr>
                          </thead>
                          <tbody>
                              {slots_html}
                          </tbody>
                      </table>

                      <p style="margin-top: 25px; text-align: center;">
                          <a href="https://www.ncts.ie" style="display: inline-block; background: #007bff; color: white; padding: 12px 30px; text-decoration: none; border-radius: 8px; font-weight: bold;">
                              🔗 {'Reschedule' if is_reschedule else 'Book'} Now on NCTS.ie
                          </a>
                      </p>

                      <hr style="border: none; border-top: 1px solid #eee; margin: 25px 0;">

                      <p style="color: #6c757d; font-size: 12px; text-align: center; margin: 0;">
                          📊 Total slots found: {len(slots)} | Mode: {'Reschedule' if is_reschedule else 'New Booking'} | Checked: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} UTC<br>
                          This is an automated hourly check. Reply to unsubscribe.
                      </p>
                  </div>
              </body>
              </html>
              """
              return html

          async def main():
              print(f"=== NCT Slot Monitor ===")
              print(f"Registration: {REGISTRATION}")
              print(f"Booking ID: {BOOKING_ID or 'Not set (new booking flow)'}")
              print(f"Alert Email: {ALERT_EMAIL or 'Not configured'}")
              print(f"Urgent threshold: {URGENT_THRESHOLD} days")
              print(f"Soon threshold: {SOON_THRESHOLD} days")
              print()

              vehicle_info, booking_info, slots = await check_nct_availability()
              is_reschedule = bool(booking_info)

              if not slots:
                  print("No slots found or error occurred")
                  # Send email even when no slots found
                  if ALERT_EMAIL:
                      subject = f"❌ NCT Monitor: No slots found for {REGISTRATION}"
                      html = f"""
                      <html><body style="font-family: Arial, sans-serif; padding: 20px;">
                          <h2>❌ NCT Slot Check Failed</h2>
                          <p>No available slots found for registration <strong>{REGISTRATION}</strong>.</p>
                          {'<p>Booking ID: <strong>' + BOOKING_ID + '</strong></p>' if BOOKING_ID else ''}
                          <p>This could be due to:</p>
                          <ul>
                              <li>Website temporarily unavailable</li>
                              <li>No slots currently in the system</li>
                              <li>Registration number issue</li>
                              {'<li>Invalid booking ID</li>' if BOOKING_ID else ''}
                          </ul>
                          <p><a href="https://www.ncts.ie">Check manually on NCTS.ie</a></p>
                          <p style="color: #888; font-size: 12px;">Checked: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')} UTC</p>
                      </body></html>
                      """
                      send_alert_email(subject, html)
                  return

              print(f"\nFound {len(slots)} available slots:")
              for slot in slots[:10]:
                  print(f"  - {slot['centre']}: {slot['date_formatted']} ({slot['days_away']} days)")

              if is_reschedule:
                  print(f"\nCurrent booking: {booking_info.get('centre', 'N/A')} on {booking_info.get('date', 'N/A')}")

              earliest = slots[0]
              print(f"\nEarliest available: {earliest['centre']} - {earliest['date_formatted']} ({earliest['days_away']} days)")

              # Determine alert type and send email
              urgent_slots = [s for s in slots if s['days_away'] <= URGENT_THRESHOLD]
              soon_slots = [s for s in slots if s['days_away'] <= SOON_THRESHOLD]

              mode_prefix = "Reschedule" if is_reschedule else "NCT"

              if urgent_slots:
                  print(f"\n🚨 URGENT: {len(urgent_slots)} slot(s) within {URGENT_THRESHOLD} days!")
                  subject = f"🚨 URGENT {mode_prefix}: {earliest['centre']} in {earliest['days_away']} days! [{REGISTRATION}]"
                  html = generate_status_email(vehicle_info, booking_info, slots, "urgent")
              elif soon_slots:
                  print(f"\n📅 {len(soon_slots)} slot(s) within {SOON_THRESHOLD} days")
                  subject = f"📅 {mode_prefix} Alert: {earliest['centre']} in {earliest['days_away']} days [{REGISTRATION}]"
                  html = generate_status_email(vehicle_info, booking_info, slots, "soon")
              else:
                  print(f"\n✓ No urgent slots - earliest is {earliest['days_away']} days away")
                  subject = f"✅ {mode_prefix} Status: {earliest['centre']} - {earliest['date_formatted']} ({earliest['days_away']} days) [{REGISTRATION}]"
                  html = generate_status_email(vehicle_info, booking_info, slots, "info")

              # Always send email
              send_alert_email(subject, html)

              # Output summary for GitHub Actions
              print(f"\n::notice::Earliest NCT slot: {earliest['centre']} on {earliest['date_formatted']} ({earliest['days_away']} days)")

          asyncio.run(main())
          PYTHON_SCRIPT
